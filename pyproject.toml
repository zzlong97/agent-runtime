[project]
name = "agent-runtime"
version = "0.1.0"
description = "A staged conversational agent runtime built with FastAPI and LangGraph."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "langchain==1.4.0",
    "langchain-openai==1.6.2",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "bailian: 仅在显式启用真实百炼模型调用时运行",
    "postgres: 需要可连接的 PostgreSQL 测试数据库",
    "redis: 需要可连接的 Redis 测试服务",
]
