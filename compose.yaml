services:
  postgres:
    image: postgres:17
    container_name: agent-runtime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runtime}
      POSTGRES_DB: ${POSTGRES_DB:-agent_runtime}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agent-runtime-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  agent-runtime-postgres:
    name: agent-runtime-postgres
